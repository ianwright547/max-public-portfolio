name: Max tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app migrations scripts tests
      - name: Apply migrations to a clean CI database
        env:
          MAX_DATABASE_URL: sqlite:////tmp/max_ci_migrations.db
        run: python -m alembic upgrade head
      - name: Verify migration metadata is current
        env:
          MAX_DATABASE_URL: sqlite:////tmp/max_ci_migrations.db
        run: python -m alembic check
      - name: Run tests
        run: python -m pytest -q
